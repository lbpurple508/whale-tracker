name: Pump Scanner

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

concurrency:
  group: pump-scanner
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pump-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests numpy

      - name: Restore pump state
        uses: actions/cache/restore@v4
        with:
          path: |
            pump_scanner_state.json
            pump_signal_history.json
          key: pump-state-${{ github.run_id }}
          restore-keys: |
            pump-state-

      - name: Run pump scanner
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python market_scanner.py

      - name: Save pump state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            pump_scanner_state.json
            pump_signal_history.json
          key: pump-state-${{ github.run_id }}
