name: Trend Scanner

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

concurrency:
  group: trend-scanner
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install requests
      - name: Restore cache
        uses: actions/cache/restore@v4
        with:
          path: |
            trend_cooldown.json
            trend_rejections.json
            trend_history.json
            trend_signals.json
          key: trend-cooldown-${{ github.run_id }}
          restore-keys: |
            trend-cooldown-
      - name: Run trend scanner
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python trend_scanner.py
      - name: Save cache
        uses: actions/cache/save@v4
        if: always()
        with:
          path: |
            trend_cooldown.json
            trend_rejections.json
            trend_history.json
            trend_signals.json
          key: trend-cooldown-${{ github.run_id }}
      - name: Upload rejections
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trend-rejections
          path: trend_rejections.json
          retention-days: 1
          overwrite: true
          if-no-files-found: ignore
      - name: Upload signals
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trend-signals
          path: trend_signals.json
          retention-days: 7
          overwrite: true
          if-no-files-found: ignore
