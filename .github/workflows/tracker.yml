name: Signal Tracker

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

concurrency:
  group: signal-tracker
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  track:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Restore tracker state
        uses: actions/cache/restore@v4
        with:
          path: tracker_state.json
          key: tracker-state-${{ github.run_id }}
          restore-keys: |
            tracker-state-

      - name: Restore monitor signals
        uses: actions/cache/restore@v4
        with:
          path: monitor_signals.json
          key: monitor-cooldown-${{ github.run_id }}
          restore-keys: |
            monitor-cooldown-

      - name: Run tracker
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python tracker.py

      - name: Save tracker state
        uses: actions/cache/save@v4
        if: always()
        with:
          path: tracker_state.json
          key: tracker-state-${{ github.run_id }}
