name: Momentum Scanner

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

concurrency:
  group: momentum-scanner
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install requests
      - name: Restore cache
        uses: actions/cache/restore@v4
        with:
          path: |
            momentum_cooldown.json
            momentum_rejections.json
            momentum_history.json
            momentum_signals.json
          key: momentum-cooldown-${{ github.run_id }}
          restore-keys: |
            momentum-cooldown-
      - name: Run momentum scanner
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python momentum_scanner.py
      - name: Save cache
        uses: actions/cache/save@v4
        if: always()
        with:
          path: |
            momentum_cooldown.json
            momentum_rejections.json
            momentum_history.json
            momentum_signals.json
          key: momentum-cooldown-${{ github.run_id }}
      - name: Upload rejections
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: momentum-rejections
          path: momentum_rejections.json
          retention-days: 1
          overwrite: true
          if-no-files-found: ignore
      - name: Upload signals
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: momentum-signals
          path: momentum_signals.json
          retention-days: 7
          overwrite: true
          if-no-files-found: ignore
