name: Market Scanner

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

concurrency:
  group: market-scanner
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  market-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests numpy

      - name: Restore pump state
        uses: actions/cache/restore@v4
        with:
          path: |
            market_state.json
            market_events.json
          key: market-state-${{ github.run_id }}
          restore-keys: |
            market-state-

      - name: Run market scanner
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SCANNER_PROFILE: ${{ secrets.SCANNER_PROFILE }}
        run: |
          python market_scanner.py

      - name: Save market state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            market_state.json
            market_events.json
          key: market-state-${{ github.run_id }}
