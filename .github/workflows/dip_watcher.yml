name: Dip Watcher

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

concurrency:
  group: dip-watcher
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Download monitor signals
        uses: dawidd6/action-download-artifact@v6
        continue-on-error: true
        with:
          name: monitoring-signals
          workflow: monitoring_scanner.yml
          path: monitor/
          if_no_artifact_found: ignore

      - name: Restore dip state
        uses: actions/cache/restore@v4
        with:
          path: |
            dip_state.json
            dip_confirmed.json
          key: dip-state-${{ github.run_id }}
          restore-keys: |
            dip-state-

      - name: Run dip watcher
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python dip_watcher.py

      - name: Save dip state
        uses: actions/cache/save@v4
        if: always()
        with:
          path: |
            dip_state.json
            dip_confirmed.json
          key: dip-state-${{ github.run_id }}

      - name: Upload dip confirmed
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dip-confirmed
          path: dip_confirmed.json
          retention-days: 7
          overwrite: true
          if-no-files-found: ignore
