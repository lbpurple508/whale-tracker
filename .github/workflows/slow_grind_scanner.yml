name: Slow Grind Scanner

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

concurrency:
  group: slow-grind-scanner
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install requests
      - name: Restore cache
        uses: actions/cache/restore@v4
        with:
          path: |
            grind_cooldown.json
            grind_rejections.json
            grind_history.json
            grind_signals.json
          key: grind-cooldown-${{ github.run_id }}
          restore-keys: |
            grind-cooldown-
      - name: Run slow grind scanner
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python slow_grind_scanner.py
      - name: Save cache
        uses: actions/cache/save@v4
        if: always()
        with:
          path: |
            grind_cooldown.json
            grind_rejections.json
            grind_history.json
            grind_signals.json
          key: grind-cooldown-${{ github.run_id }}
          if-no-files-found: ignore
      - name: Upload rejections
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: grind-rejections
          path: grind_rejections.json
          retention-days: 1
          overwrite: true
          if-no-files-found: ignore
      - name: Upload signals
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: grind-signals
          path: grind_signals.json
          retention-days: 7
          overwrite: true
          if-no-files-found: ignore
