name: Dump Rejections

on:
  workflow_dispatch:

jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download spike rejections
        uses: dawidd6/action-download-artifact@v6
        continue-on-error: true
        with:
          name: spike-rejections
          workflow: scanner.yml
          path: spike/
          if_no_artifact_found: ignore
          search_artifacts: true

      - name: Download grind rejections
        uses: dawidd6/action-download-artifact@v6
        continue-on-error: true
        with:
          name: grind-rejections
          workflow: slow_grind_scanner.yml
          path: grind/
          if_no_artifact_found: ignore
          search_artifacts: true

      - name: Download futures rejections
        uses: dawidd6/action-download-artifact@v6
        continue-on-error: true
        with:
          name: futures-rejections
          workflow: futures_scanner.yml
          path: futures/
          if_no_artifact_found: ignore
          search_artifacts: true

      - name: Display spike
        run: |
          echo "========================================"
          echo "SPIKE REJECTIONS"
          echo "========================================"
          if [ -f spike/rejections.json ]; then
            python3 scripts/dump.py spike/rejections.json
          else
            echo "no spike file"
          fi

      - name: Display grind
        run: |
          echo "========================================"
          echo "GRIND REJECTIONS"
          echo "========================================"
          if [ -f grind/grind_rejections.json ]; then
            python3 scripts/dump.py grind/grind_rejections.json
          else
            echo "no grind file"
          fi

      - name: Display futures
        run: |
          echo "========================================"
          echo "FUTURES REJECTIONS"
          echo "========================================"
          if [ -f futures/futures_rejections.json ]; then
            python3 scripts/dump.py futures/futures_rejections.json
          else
            echo "no futures file"
          fi
