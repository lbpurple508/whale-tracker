name: Dump Rejections Report

on:
  workflow_dispatch:

concurrency:
  group: dump-rejections
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  dump:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Download monitor rejections
        uses: dawidd6/action-download-artifact@v6
        continue-on-error: true
        with:
          name: monitoring-rejections
          workflow: monitoring_scanner.yml
          path: monitor/
          if_no_artifact_found: ignore
          search_artifacts: true

      - name: Build report
        run: python3 scripts/dump.py monitor/monitor_rejections.json > report.txt

      - name: Show report
        run: cat report.txt

      - name: Send to Telegram
        if: always()
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 scripts/send_report.py
