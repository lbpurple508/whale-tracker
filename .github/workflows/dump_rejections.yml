name: Dump Rejections Report

on:
  workflow_dispatch:

jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download spike rejections
        uses: dawidd6/action-download-artifact@v6
        continue-on-error: true
        with:
          name: spike-rejections
          workflow: scanner.yml
          path: spike/
          if_no_artifact_found: ignore
          search_artifacts: true

      - name: Download grind rejections
        uses: dawidd6/action-download-artifact@v6
        continue-on-error: true
        with:
          name: grind-rejections
          workflow: slow_grind_scanner.yml
          path: grind/
          if_no_artifact_found: ignore
          search_artifacts: true

      - name: Download futures rejections
        uses: dawidd6/action-download-artifact@v6
        continue-on-error: true
        with:
          name: futures-rejections
          workflow: futures_scanner.yml
          path: futures/
          if_no_artifact_found: ignore
          search_artifacts: true

      - name: Build report
        run: python3 scripts/dump.py spike/rejections.json grind/grind_rejections.json futures/futures_rejections.json > report.txt

      - name: Show report
        run: cat report.txt

      - name: Send to Telegram
        if: always()
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 scripts/send_report.py
