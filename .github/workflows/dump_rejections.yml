name: Dump Rejections

on:
  workflow_dispatch:

jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download spike rejections
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: spike-rejections
          path: spike/
      - name: Download grind rejections
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: grind-rejections
          path: grind/
      - name: Download futures rejections
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: futures-rejections
          path: futures/
      - name: Display spike
        run: |
          echo "=== SPIKE REJECTIONS ==="
          if [ -f spike/rejections.json ]; then
            python3 -c "
import json
data = json.load(open('spike/rejections.json'))
items = sorted(data.items(), key=lambda x: x[1].get('count', 0), reverse=True)
print(f'{len(data)} unique coins rejected')
print()
for sym, i in items[:30]:
    print(f'{sym:<15} {i.get(\"count\", 0):>5}x  {i.get(\"change_24h\", 0):>7.2f}%  {i.get(\"top_reason\", \"\")}')
"
          else
            echo "no spike rejections file"
          fi
      - name: Display grind
        run: |
          echo "=== GRIND REJECTIONS ==="
          if [ -f grind/grind_rejections.json ]; then
            python3 -c "
import json
data = json.load(open('grind/grind_rejections.json'))
items = sorted(data.items(), key=lambda x: x[1].get('count', 0), reverse=True)
print(f'{len(data)} unique coins rejected')
print()
for sym, i in items[:30]:
    print(f'{sym:<15} {i.get(\"count\", 0):>5}x  {i.get(\"change_24h\", 0):>7.2f}%  {i.get(\"top_reason\", \"\")}')
"
          else
            echo "no grind rejections file"
          fi
      - name: Display futures
        run: |
          echo "=== FUTURES REJECTIONS ==="
          if [ -f futures/futures_rejections.json ]; then
            python3 -c "
import json
data = json.load(open('futures/futures_rejections.json'))
items = sorted(data.items(), key=lambda x: x[1].get('count', 0), reverse=True)
print(f'{len(data)} unique coins rejected')
print()
for sym, i in items[:30]:
    print(f'{sym:<15} {i.get(\"count\", 0):>5}x  {i.get(\"change_24h\", 0):>7.2f}%  {i.get(\"top_reason\", \"\")}')
"
          else
            echo "no futures rejections file"
          fi
